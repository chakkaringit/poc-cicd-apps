apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: siftqueue1
spec:
  template:
    spec:
      containers:
      - name: siftqueue1
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 200m
            memory: 1500Mi

