apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sift-core
spec:
  template:
    spec:
      containers:
      - name: sift-core
        env:
        - name: HEAP_SIZE
          value: 256m
        resources:
          limits:
            cpu: 100m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 512Mi
